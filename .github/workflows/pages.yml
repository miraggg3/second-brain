# Builds the Mini App on every PR; on push to main also publishes dist/ to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR builds: one queue per branch, a newer push cancels the older build.
  # main deploys: their own queue and never cancelled midway, so a PR build
  # (or the auto-merge) can't stop a deploy that is already running.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || 'pages-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # address of the Cloudflare Worker (repo Settings → Variables → API_BASE)
          VITE_API_BASE: ${{ vars.API_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
